name: deepin 25 CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build-deepin-25-deb:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:crimson
      options: --user root

    steps:
      - name: Update package lists and install basic tools
        run: |
          apt update
          apt install -y git ca-certificates curl file
      - uses: actions/checkout@v6
      - name: Get build deps
        run: |
          apt install -y --no-install-recommends \
            build-essential cmake pkg-config dpkg-dev file \
            qt6-base-dev qt6-declarative-dev \
            libdtk6core-dev libdtk6gui-dev libdtk6declarative-dev \
            libappstreamqt-dev libflatpak-dev
      - name: Build it
        run: |
          git config --global --add safe.directory '*' # to avoid "fatal: detected dubious ownership in repository at xxx"
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr .
          cmake --build build -j$(nproc)
          cd build
          cpack -G DEB
      - name: Try install it
        run: |
          cd build
          apt install -y ./*.deb
          dpkg -L dodo-store
          test -x /usr/bin/dodo-store
          echo "deb installed and /usr/bin/dodo-store present"
      - uses: actions/upload-artifact@v6
        with:
          name: deepin-25-deb-package
          path: build/*.deb
